name: Cross-platform release candidates

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: linux-x86_64
          - runner: ubuntu-22.04-arm
            artifact: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ca-certificates cmake curl gawk \
            libtool pkg-config libice-dev libsm-dev libx11-dev libxext-dev libxmu-dev \
            libcairo2-dev \
            libgeotiff-dev libtiff-dev libhdf5-dev libjpeg-dev libnetcdf-dev \
            libudunits2-dev zlib1g-dev

      - name: Build, test, and package
        env:
          OPENGRADS_BUILD_JOBS: 4
        run: ./release/build-release.sh

      - name: Verify archive
        run: |
          cd release-dist
          sha256sum -c -- *.sha256
          for archive in *.tar.gz; do
            tar -tzf "$archive"
          done | sed -n '1,80p'

      - name: Upload approved binary artifact
        if: ${{ vars.BINARY_REDISTRIBUTION_APPROVED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: opengrads-${{ matrix.artifact }}
          path: |
            release-dist/*.tar.gz
            release-dist/*.sha256
          if-no-files-found: error

  macos:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: macos-arm64
          - runner: macos-15-intel
            artifact: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build prerequisites
        run: |
          brew update
          brew install adios2 autoconf automake cairo coreutils gcc libgeotiff hdf5 \
            libomp libtool netcdf pkgconf udunits

      - name: Build, test, and package
        env:
          OPENGRADS_BUILD_JOBS: 4
        run: ./release/build-release-macos.sh

      - name: Verify archive
        run: |
          cd release-dist
          shasum -a 256 -c -- *.sha256
          for archive in *.tar.gz; do
            tar -tzf "$archive"
          done | sed -n '1,80p'

      - name: Upload approved binary artifact
        if: ${{ vars.BINARY_REDISTRIBUTION_APPROVED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: opengrads-${{ matrix.artifact }}
          path: |
            release-dist/*.tar.gz
            release-dist/*.sha256
          if-no-files-found: error

  publish:
    name: Attach approved binaries to GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.BINARY_REDISTRIBUTION_APPROVED == 'true' }}
    needs: [linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: opengrads-*
          path: artifacts
          merge-multiple: true

      - name: Check the tag matches the distribution version
        run: |
          dist_version="$(cat release/VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "v${dist_version}" ]]; then
            printf 'Tag %s does not match release/VERSION (%s).\n' \
              "${GITHUB_REF_NAME}" "${dist_version}" >&2
            exit 1
          fi

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "opengrads-hpc $(cat release/VERSION)" \
            --notes-file docs/RELEASE_NOTES.md \
            --repo "${GITHUB_REPOSITORY}"
