name: Cross-platform release candidates

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: linux-x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-22.04-arm
            artifact: linux-aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    # Built inside AlmaLinux 8 (glibc 2.28) rather than on the Ubuntu 22.04
    # runner (glibc 2.35). glibc is forward-compatible only, so a 2.35 build
    # cannot run on the RHEL 8 family that HPC clusters are still on.
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build prerequisites
        run: |
          dnf -y install epel-release
          dnf config-manager --set-enabled powertools || \
            dnf config-manager --set-enabled crb || true
          dnf -y install \
            autoconf automake libtool make gawk pkgconf-pkg-config cmake curl tar \
            cairo-devel libX11-devel libXext-devel libXmu-devel libICE-devel \
            libSM-devel libgeotiff-devel libtiff-devel hdf5-devel \
            libjpeg-turbo-devel netcdf-devel udunits2-devel zlib-devel

      - name: Build, test, and package
        env:
          OPENGRADS_BUILD_JOBS: 4
        run: ./release/build-release.sh

      - name: Verify archive
        run: |
          cd release-dist
          sha256sum -c -- *.sha256
          for archive in *.tar.gz; do
            tar -tzf "$archive"
          done | sed -n '1,80p'

      - name: Upload approved binary artifact
        if: ${{ vars.BINARY_REDISTRIBUTION_APPROVED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: opengrads-${{ matrix.artifact }}
          path: |
            release-dist/*.tar.gz
            release-dist/*.sha256
          if-no-files-found: error

  macos:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: macos-arm64
          - runner: macos-15-intel
            artifact: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build prerequisites
        run: |
          brew update
          brew install adios2 autoconf automake cairo coreutils gcc libgeotiff hdf5 \
            libomp libtool netcdf pkgconf readline udunits

      - name: Build, test, and package
        env:
          OPENGRADS_BUILD_JOBS: 4
        run: ./release/build-release-macos.sh

      - name: Verify archive
        run: |
          cd release-dist
          shasum -a 256 -c -- *.sha256
          for archive in *.tar.gz; do
            tar -tzf "$archive"
          done | sed -n '1,80p'

      - name: Upload approved binary artifact
        if: ${{ vars.BINARY_REDISTRIBUTION_APPROVED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: opengrads-${{ matrix.artifact }}
          path: |
            release-dist/*.tar.gz
            release-dist/*.sha256
          if-no-files-found: error

  publish:
    name: Attach approved binaries to GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.BINARY_REDISTRIBUTION_APPROVED == 'true' }}
    needs: [linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: opengrads-*
          path: artifacts
          merge-multiple: true

      - name: Check the tag matches the distribution version
        run: |
          dist_version="$(cat release/VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "v${dist_version}" ]]; then
            printf 'Tag %s does not match release/VERSION (%s).\n' \
              "${GITHUB_REF_NAME}" "${dist_version}" >&2
            exit 1
          fi

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "opengrads-hpc $(cat release/VERSION)" \
            --notes-file docs/RELEASE_NOTES.md \
            --repo "${GITHUB_REPOSITORY}"
